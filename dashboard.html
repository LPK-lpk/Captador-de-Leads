<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Captador de Leads</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0d0d; color: #f0f0f0;
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center; padding: 32px 16px;
    }
    .card {
      background: #1c1c1c; border: 1px solid #2e2e2e; border-radius: 20px;
      padding: 36px; width: 100%; max-width: 480px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.6);
    }
    #loginScreen { display: flex; flex-direction: column; }
    #appScreen   { display: none; flex-direction: column; }

    .icon { font-size: 2.2rem; margin-bottom: 10px; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .subtitle { font-size: 0.85rem; color: #555; margin-bottom: 28px; }

    .field-group { margin-bottom: 14px; }
    label {
      display: block; font-size: 0.72rem; font-weight: 600; color: #666;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 7px;
    }
    input[type="text"], input[type="password"], input[type="url"] {
      width: 100%; background: #111; border: 1px solid #2e2e2e;
      border-radius: 10px; color: #f0f0f0; font-size: 0.92rem;
      padding: 12px 14px; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #4ade80; }
    input::placeholder { color: #333; }

    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 11px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover:not(:disabled) { opacity: 0.88; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn-primary  { background: #4ade80; color: #0d0d0d; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .msg { font-size: 0.82rem; margin-top: 8px; min-height: 18px; text-align: center; }

    /* Seção avançada */
    .adv-toggle {
      display: flex; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer;
      color: #444; font-size: 0.75rem; padding: 0; margin-bottom: 12px;
      transition: color 0.2s; width: fit-content;
    }
    .adv-toggle:hover { color: #777; }
    .adv-toggle .arr { transition: transform 0.2s; display: inline-block; }
    .adv-toggle.open .arr { transform: rotate(90deg); }
    .adv-box {
      background: #131313; border: 1px solid #1e1e1e; border-radius: 12px;
      padding: 14px; margin-bottom: 16px; display: none;
    }
    .adv-box.vis { display: block; }

    /* Stats */
    .stats {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 10px;
      margin-bottom: 18px;
    }
    .stat  { background: #111; border: 1px solid #222; border-radius: 10px; padding: 12px; text-align: center; }
    .stat-n { font-size: 1.4rem; font-weight: 700; color: #4ade80; }
    .stat-l { font-size: 0.68rem; color: #555; margin-top: 3px; }

    /* Log */
    .log {
      background: #080808; border: 1px solid #1e1e1e; border-radius: 10px;
      padding: 12px; font-size: 0.77rem; color: #555; margin-top: 14px;
      max-height: 140px; overflow-y: auto; display: none;
    }
    .log.vis { display: block; }
    .l-ok   { color: #4ade80; }
    .l-err  { color: #f87171; }
    .l-inf  { color: #60a5fa; }
    .l-warn { color: #facc15; }
    .l-line { padding: 2px 0; line-height: 1.5; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin {
      display: inline-block; width: 13px; height: 13px;
      border: 2px solid #0d0d0d44; border-top-color: #0d0d0d;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      margin-right: 7px; vertical-align: middle;
    }

    .app-top {
      display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px;
    }
    .app-title { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .app-sub   { font-size: 0.76rem; color: #444; margin-top: 2px; }
    .exit-btn  {
      background: none; border: none; color: #333; font-size: 0.75rem;
      cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: color 0.2s;
    }
    .exit-btn:hover { color: #f87171; }

    .divider { border: none; border-top: 1px solid #1e1e1e; margin: 16px 0; }

    .row { display: flex; gap: 10px; }
    .row .field-group { flex: 1; }

    .tip {
      font-size: 0.72rem; color: #3a3a3a; margin-top: 5px; line-height: 1.5;
    }
    .tip code {
      background: #191919; border: 1px solid #282828; border-radius: 4px;
      padding: 1px 5px; color: #facc15; font-size: 0.7rem;
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="card" id="loginScreen">
  <div class="icon">📲</div>
  <h1>Captador de Leads</h1>
  <p class="subtitle">Evolution API → Google Sheets</p>
  <div class="field-group">
    <label>Senha</label>
    <input type="password" id="pw" placeholder="••••••••"
           onkeydown="if(event.key==='Enter') login()" autofocus />
  </div>
  <button class="btn btn-primary" onclick="login()">Entrar</button>
  <p class="msg" id="loginErr" style="color:#f87171"></p>
</div>

<!-- APP -->
<div class="card" id="appScreen">

  <div class="app-top">
    <div>
      <div class="app-title">📲 Captador de Leads</div>
      <div class="app-sub">Evolution API → Google Sheets</div>
    </div>
    <button class="exit-btn" onclick="logout()">Sair</button>
  </div>

  <!-- Campos principais -->
  <div class="field-group">
    <label>Nome da Instância</label>
    <input type="text" id="fInstance" placeholder="Ex: SeoSalimBarbearia"
           oninput="validate()" />
    <p class="tip">Nome exato da instância no painel da Evolution API</p>
  </div>

  <div class="row">
    <div class="field-group">
      <label>Evolution URL</label>
      <input type="url" id="fUrl" placeholder="http://..." oninput="validate()" />
    </div>
    <div class="field-group">
      <label>API Key</label>
      <input type="text" id="fKey" placeholder="••••••••" oninput="validate()" />
    </div>
  </div>

  <!-- Avançado: webhook -->
  <button class="adv-toggle" id="advBtn" onclick="toggleAdv()">
    <span class="arr">▶</span> Avançado
  </button>
  <div class="adv-box" id="advBox">
    <div class="field-group" style="margin-bottom:0">
      <label>Webhook n8n</label>
      <input type="url" id="fWh" placeholder="https://..." />
    </div>
  </div>

  <!-- Stats (aparece após captura) -->
  <div class="stats" id="stats" style="display:none">
    <div class="stat"><div class="stat-n" id="sTotal">0</div><div class="stat-l">Capturados</div></div>
    <div class="stat"><div class="stat-n" id="sNovos">0</div><div class="stat-l">Inseridos</div></div>
    <div class="stat"><div class="stat-n" id="sDup">0</div><div class="stat-l">Duplicados</div></div>
  </div>

  <!-- Botão principal -->
  <button class="btn btn-primary" id="captBtn" onclick="capturar()" disabled>
    🚀 Capturar Leads
  </button>

  <!-- Log -->
  <div class="log" id="logEl"></div>
</div>

<script>
const SENHA   = '34266450';
const CFG_KEY = 'captador_config';
const DEFAULTS = {
  evolutionUrl: 'http://n8n-evolution.ndjgby.easypanel.host',
  webhookUrl:   'https://n8n-n8n-start.ndjgby.easypanel.host/webhook/importar-leads-barbearia',
  apikey:       ''
};
let cfg = {};

// ─── Config ───────────────────────────────────────────────────
function loadConfig() {
  try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch(e) { cfg = {}; }
  document.getElementById('fInstance').value = cfg.lastInstance  || '';
  document.getElementById('fUrl').value      = cfg.evolutionUrl  || DEFAULTS.evolutionUrl;
  document.getElementById('fKey').value      = cfg.apikey        || '';
  document.getElementById('fWh').value       = cfg.webhookUrl    || DEFAULTS.webhookUrl;
  validate();
}

function saveConfig() {
  cfg.lastInstance = document.getElementById('fInstance').value.trim();
  cfg.evolutionUrl = document.getElementById('fUrl').value.trim().replace(/\/+$/, '') || DEFAULTS.evolutionUrl;
  cfg.apikey       = document.getElementById('fKey').value.trim();
  cfg.webhookUrl   = document.getElementById('fWh').value.trim() || DEFAULTS.webhookUrl;
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
}

function validate() {
  const ok = document.getElementById('fInstance').value.trim() &&
             document.getElementById('fUrl').value.trim() &&
             document.getElementById('fKey').value.trim();
  document.getElementById('captBtn').disabled = !ok;
}

function toggleAdv() {
  document.getElementById('advBtn').classList.toggle('open');
  document.getElementById('advBox').classList.toggle('vis');
}

// ─── Auth ─────────────────────────────────────────────────────
function login() {
  if (document.getElementById('pw').value === SENHA) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display   = 'flex';
    loadConfig();
  } else {
    const el = document.getElementById('loginErr');
    el.textContent = '❌ Senha incorreta'; el.style.color = '#f87171';
  }
}

function logout() {
  document.getElementById('appScreen').style.display   = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('pw').value = '';
}

// ─── Capturar ─────────────────────────────────────────────────
async function capturar() {
  const instance    = document.getElementById('fInstance').value.trim();
  const evolutionUrl= document.getElementById('fUrl').value.trim().replace(/\/+$/, '');
  const apikey      = document.getElementById('fKey').value.trim();
  const webhookUrl  = document.getElementById('fWh').value.trim() || DEFAULTS.webhookUrl;

  if (!instance || !evolutionUrl || !apikey) return;

  saveConfig();

  const btn = document.getElementById('captBtn');
  btn.innerHTML = '<span class="spin"></span>Capturando...';
  btn.disabled  = true;
  document.getElementById('stats').style.display = 'none';
  showLog();
  log(`🚀 Instância: <b>${instance}</b>`, 'inf');

  try {
    const resp = await fetch(webhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ instance, evolutionUrl, apikey })
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    const e     = data.estatisticas || data;
    const total = e.total      ?? e.totalCapturados ?? '?';
    const novos = e.inseridos  ?? e.novosInseridos  ?? '?';
    const dup   = e.duplicados ?? e.jaExistiam      ?? '?';

    document.getElementById('sTotal').textContent = total;
    document.getElementById('sNovos').textContent = novos;
    document.getElementById('sDup').textContent   = dup;
    document.getElementById('stats').style.display = 'grid';

    if (novos > 0) {
      log(`✅ <b>${novos}</b> novos leads salvos — ${dup} já existiam`, 'ok');
    } else {
      log(`ℹ️ Nenhum lead novo — todos já estão na planilha`, 'warn');
    }
  } catch(e) {
    log(`❌ ${e.message}`, 'err');
  }

  btn.innerHTML = '🚀 Capturar Leads';
  btn.disabled  = false;
}

// ─── Log ──────────────────────────────────────────────────────
function showLog() { document.getElementById('logEl').classList.add('vis'); }
function log(msg, tipo = 'inf') {
  const el = document.getElementById('logEl');
  const t  = new Date().toLocaleTimeString('pt-BR');
  const d  = document.createElement('div');
  d.className = `l-line l-${tipo}`;
  d.innerHTML = `[${t}] ${msg}`;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}
</script>
</body>
</html>
