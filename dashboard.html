<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Captador de Leads</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0d0d; color: #f0f0f0;
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center; padding: 32px 16px;
    }
    .card {
      background: #1c1c1c; border: 1px solid #2e2e2e; border-radius: 20px;
      padding: 36px; width: 100%; max-width: 500px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.6);
    }
    #loginScreen { display: flex; flex-direction: column; }
    #appScreen   { display: none; flex-direction: column; }

    .icon { font-size: 2.2rem; margin-bottom: 10px; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .subtitle { font-size: 0.85rem; color: #555; margin-bottom: 28px; }

    .field-group { margin-bottom: 14px; }
    label {
      display: block; font-size: 0.72rem; font-weight: 600; color: #666;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 7px;
    }
    input[type="text"], input[type="password"], input[type="url"] {
      width: 100%; background: #111; border: 1px solid #2e2e2e;
      border-radius: 10px; color: #f0f0f0; font-size: 0.92rem;
      padding: 12px 14px; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #4ade80; }

    .btn {
      width: 100%; padding: 13px; border: none; border-radius: 11px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover:not(:disabled) { opacity: 0.88; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn-primary   { background: #4ade80; color: #0d0d0d; }
    .btn-secondary { background: #2a2a2a; color: #bbb; }
    .btn-sm {
      width: auto; padding: 8px 14px; font-size: 0.8rem;
      border-radius: 8px; background: #2a2a2a; color: #999;
      border: 1px solid #333;
    }
    .btn-sm:hover:not(:disabled) { border-color: #4ade80; color: #4ade80; opacity: 1; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .msg { font-size: 0.82rem; margin-top: 8px; min-height: 18px; text-align: center; }

    /* Config */
    .cfg-toggle {
      display: flex; align-items: center; gap: 7px;
      background: none; border: none; cursor: pointer;
      color: #555; font-size: 0.78rem; padding: 0; margin-bottom: 14px;
      transition: color 0.2s; width: fit-content;
    }
    .cfg-toggle:hover { color: #888; }
    .cfg-toggle .arr { transition: transform 0.2s; display: inline-block; }
    .cfg-toggle.open .arr { transform: rotate(90deg); }
    .cfg-box {
      background: #131313; border: 1px solid #222; border-radius: 12px;
      padding: 16px; margin-bottom: 20px; display: none;
    }
    .cfg-box.vis { display: block; }
    .cfg-row { display: flex; gap: 10px; }
    .cfg-row .field-group { flex: 1; margin-bottom: 14px; }

    /* Instâncias */
    .sec-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    }
    .sec-label {
      font-size: 0.72rem; font-weight: 600; color: #666;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .inst-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .inst-card {
      display: flex; align-items: center; gap: 13px;
      background: #111; border: 2px solid #252525; border-radius: 12px;
      padding: 13px 15px; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .inst-card:hover:not(.disc) { border-color: #383838; background: #161616; }
    .inst-card.sel  { border-color: #4ade80; background: #0c1e12; }
    .inst-card.disc { opacity: 0.45; cursor: not-allowed; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .dot-g { background: #4ade80; box-shadow: 0 0 7px #4ade8066; }
    .dot-r { background: #f87171; }
    .dot-y { background: #facc15; }
    .inst-info { flex: 1; min-width: 0; }
    .inst-name { font-size: 0.92rem; font-weight: 600; color: #e5e5e5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .inst-num  { font-size: 0.76rem; color: #505050; margin-top: 2px; }
    .badge {
      font-size: 0.7rem; padding: 3px 8px; border-radius: 6px;
      font-weight: 700; flex-shrink: 0; white-space: nowrap;
    }
    .badge-ok  { background: #0c2016; color: #4ade80; }
    .badge-off { background: #280f0f; color: #f87171; }
    .badge-oth { background: #1c1c08; color: #facc15; }
    .placeholder { color: #3a3a3a; font-size: 0.83rem; text-align: center; padding: 18px 0; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 20px; }
    .stat  { background: #111; border: 1px solid #222; border-radius: 10px; padding: 12px; text-align: center; }
    .stat-n { font-size: 1.35rem; font-weight: 700; color: #4ade80; }
    .stat-l { font-size: 0.68rem; color: #555; margin-top: 3px; }

    /* Log */
    .log {
      background: #080808; border: 1px solid #1e1e1e; border-radius: 10px;
      padding: 12px; font-size: 0.77rem; color: #555; margin-top: 14px;
      max-height: 130px; overflow-y: auto; display: none;
    }
    .log.vis { display: block; }
    .l-ok   { color: #4ade80; }
    .l-err  { color: #f87171; }
    .l-inf  { color: #60a5fa; }
    .l-warn { color: #facc15; }
    .l-line { padding: 2px 0; line-height: 1.5; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin {
      display: inline-block; width: 13px; height: 13px;
      border: 2px solid #0d0d0d44; border-top-color: #0d0d0d;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      margin-right: 7px; vertical-align: middle;
    }
    .spin-w { border-color: #ffffff44; border-top-color: #fff; }

    .divider { border: none; border-top: 1px solid #1e1e1e; margin: 18px 0; }
    .app-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; }
    .app-title { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .app-sub   { font-size: 0.76rem; color: #444; margin-top: 2px; }
    .exit-btn  {
      background: none; border: none; color: #3a3a3a; font-size: 0.75rem;
      cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: color 0.2s;
    }
    .exit-btn:hover { color: #f87171; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="card" id="loginScreen">
  <div class="icon">📲</div>
  <h1>Captador de Leads</h1>
  <p class="subtitle">Sistema Evolution API + n8n</p>
  <div class="field-group">
    <label>Senha de Acesso</label>
    <input type="password" id="pw" placeholder="••••••••"
           onkeydown="if(event.key==='Enter') login()" autofocus />
  </div>
  <button class="btn btn-primary" onclick="login()">Entrar</button>
  <p class="msg" id="loginErr" style="color:#f87171"></p>
</div>

<!-- APP -->
<div class="card" id="appScreen">

  <div class="app-top">
    <div>
      <div class="app-title">📲 Captador de Leads</div>
      <div class="app-sub">Evolution API → Google Sheets</div>
    </div>
    <button class="exit-btn" onclick="logout()">Sair</button>
  </div>

  <!-- Configurações -->
  <button class="cfg-toggle" id="cfgBtn" onclick="toggleCfg()">
    <span class="arr">▶</span> Configurações
  </button>
  <div class="cfg-box" id="cfgBox">
    <div class="cfg-row">
      <div class="field-group">
        <label>Evolution URL</label>
        <input type="url" id="cfgUrl" placeholder="https://..." />
      </div>
      <div class="field-group">
        <label>API Key</label>
        <input type="text" id="cfgKey" placeholder="••••••••" />
      </div>
    </div>
    <div class="field-group">
      <label>Webhook n8n</label>
      <input type="url" id="cfgWh" placeholder="https://..." />
    </div>
    <button class="btn btn-secondary" onclick="saveConfig()" style="margin-top:4px">💾 Salvar</button>
    <p class="msg" id="cfgMsg"></p>
  </div>

  <!-- Instâncias -->
  <div class="sec-header">
    <span class="sec-label">Instância WhatsApp</span>
    <button class="btn btn-sm" id="fetchBtn" onclick="fetchInstances()">🔍 Buscar Instâncias</button>
  </div>
  <div class="inst-list" id="instList">
    <div class="placeholder">Clique em "Buscar Instâncias" para listar as instâncias da Evolution</div>
  </div>

  <!-- Stats -->
  <div class="stats" id="stats" style="display:none">
    <div class="stat"><div class="stat-n" id="sTotal">0</div><div class="stat-l">Capturados</div></div>
    <div class="stat"><div class="stat-n" id="sNovos">0</div><div class="stat-l">Inseridos</div></div>
    <div class="stat"><div class="stat-n" id="sDup">0</div><div class="stat-l">Duplicados</div></div>
  </div>

  <!-- Ação -->
  <button class="btn btn-primary" id="captBtn" onclick="capturar()" disabled>
    🚀 Capturar Leads
  </button>

  <!-- Log -->
  <div class="log" id="logEl"></div>
</div>

<script>
const SENHA   = '34266450';
const CFG_KEY = 'captador_config';
let cfg = {}, instSel = null;

// Defaults pré-configurados — editáveis nas Configurações
const DEFAULTS = {
  evolutionUrl: 'http://n8n-evolution.ndjgby.easypanel.host',
  webhookUrl:   'https://n8n-n8n-start.ndjgby.easypanel.host/webhook/importar-leads-barbearia',
  apikey:       ''
};

// ─── Config ───────────────────────────────────────────────────
function loadConfig() {
  try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch(e) { cfg = {}; }
  document.getElementById('cfgUrl').value = cfg.evolutionUrl || DEFAULTS.evolutionUrl;
  document.getElementById('cfgKey').value = cfg.apikey       || DEFAULTS.apikey;
  document.getElementById('cfgWh').value  = cfg.webhookUrl   || DEFAULTS.webhookUrl;
  // Garante que os defaults fiquem no cfg também
  cfg.evolutionUrl = cfg.evolutionUrl || DEFAULTS.evolutionUrl;
  cfg.webhookUrl   = cfg.webhookUrl   || DEFAULTS.webhookUrl;
}

function saveConfig() {
  cfg.evolutionUrl = document.getElementById('cfgUrl').value.trim().replace(/\/+$/, '');
  cfg.apikey       = document.getElementById('cfgKey').value.trim();
  cfg.webhookUrl   = document.getElementById('cfgWh').value.trim();
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
  showMsg('cfgMsg', '✅ Configurações salvas!', '#4ade80');
  setTimeout(() => showMsg('cfgMsg', ''), 2500);
}

function showMsg(id, txt, color = '#f87171') {
  const el = document.getElementById(id);
  el.textContent = txt; el.style.color = color;
}

function toggleCfg() {
  document.getElementById('cfgBtn').classList.toggle('open');
  document.getElementById('cfgBox').classList.toggle('vis');
}

// ─── Auth ─────────────────────────────────────────────────────
function login() {
  if (document.getElementById('pw').value === SENHA) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display   = 'flex';
    loadConfig();
  } else {
    showMsg('loginErr', '❌ Senha incorreta');
  }
}

function logout() {
  document.getElementById('appScreen').style.display   = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('pw').value = '';
  instSel = null;
}

// ─── Buscar Instâncias ────────────────────────────────────────
async function fetchInstances() {
  const url = (document.getElementById('cfgUrl').value.trim() || cfg.evolutionUrl || '').replace(/\/+$/, '');
  const key  = document.getElementById('cfgKey').value.trim() || cfg.apikey || '';

  if (!url || !key) {
    alert('Preencha Evolution URL e API Key nas ⚙️ Configurações primeiro.');
    document.getElementById('cfgBtn').classList.add('open');
    document.getElementById('cfgBox').classList.add('vis');
    return;
  }

  // Salva automaticamente
  cfg.evolutionUrl = url; cfg.apikey = key;
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));

  const btn = document.getElementById('fetchBtn');
  btn.innerHTML = '<span class="spin spin-w"></span>Buscando...';
  btn.disabled = true;
  instSel = null;
  document.getElementById('captBtn').disabled = true;

  try {
    const resp = await fetch(`${url}/instance/fetchInstances`, {
      headers: { 'apikey': key, 'Content-Type': 'application/json' }
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status} — verifique a URL e API Key`);

    let data = await resp.json();
    // Normaliza: Evolution pode retornar array ou {instances:[...]} ou {data:[...]}
    const list = Array.isArray(data) ? data
               : (data.instances || data.data || []);

    renderList(list, url, key);
    if (list.length > 0) log(`🔍 ${list.length} instância(s) encontrada(s)`, 'inf');

  } catch(e) {
    const isCors = e.message === 'Failed to fetch';
    const helpMsg = isCors
      ? `❌ CORS bloqueado — abra o arquivo via servidor local.<br>
         <small style="color:#555">No terminal, na pasta do arquivo:<br>
         <code style="color:#facc15">python -m http.server 8080</code><br>
         Depois acesse: <code style="color:#facc15">http://localhost:8080/dashboard.html</code></small>`
      : `❌ ${e.message}`;
    document.getElementById('instList').innerHTML =
      `<div class="placeholder" style="line-height:1.7">${helpMsg}</div>`;
    log(`Erro: ${isCors ? 'CORS bloqueado (abra via localhost)' : e.message}`, 'err');
    showLog();
  }

  btn.innerHTML = '🔍 Buscar Instâncias';
  btn.disabled = false;
}

function renderList(list, url, key) {
  const el = document.getElementById('instList');
  if (!list.length) {
    el.innerHTML = '<div class="placeholder">Nenhuma instância encontrada nessa Evolution</div>';
    return;
  }

  // Ordena: conectadas primeiro
  list.sort((a, b) => {
    const sa = a.instance?.state || a.state || '';
    const sb = b.instance?.state || b.state || '';
    return (sa === 'open' ? 0 : 1) - (sb === 'open' ? 0 : 1);
  });

  el.innerHTML = '';
  list.forEach(inst => {
    const nome   = inst.instance?.instanceName || inst.instanceName || inst.name || '?';
    const status = (inst.instance?.state || inst.state || inst.status || 'unknown').toLowerCase();
    const numero = (inst.instance?.owner || inst.owner || inst.number || '').replace('@s.whatsapp.net', '');
    const ok     = status === 'open';
    const restart= status.includes('restart') || status.includes('connecting');

    const dotCls  = ok ? 'dot-g' : (restart ? 'dot-y' : 'dot-r');
    const bdgCls  = ok ? 'badge-ok' : (restart ? 'badge-oth' : 'badge-off');
    const bdgTxt  = ok ? 'Conectado' : (restart ? 'Reiniciando' : 'Desconectado');

    const card = document.createElement('div');
    card.className = `inst-card${ok ? '' : ' disc'}`;
    card.innerHTML = `
      <div class="dot ${dotCls}"></div>
      <div class="inst-info">
        <div class="inst-name">${nome}</div>
        <div class="inst-num">${numero || '—'}</div>
      </div>
      <span class="badge ${bdgCls}">${bdgTxt}</span>
    `;
    if (ok) {
      card.onclick = () => selectInst(card, nome, url, key);
    } else {
      card.title = 'Instância desconectada. Reconecte no painel da Evolution (escaneie o QR Code) antes de usar.';
    }
    el.appendChild(card);
  });
}

function selectInst(card, nome, url, key) {
  document.querySelectorAll('.inst-card').forEach(c => c.classList.remove('sel'));
  card.classList.add('sel');
  instSel = { instance: nome, evolutionUrl: url, apikey: key };
  cfg.lastInstance = nome;
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
  document.getElementById('captBtn').disabled = false;
  log(`✅ Instância selecionada: <b>${nome}</b>`, 'ok');
  showLog();
}

// ─── Capturar ─────────────────────────────────────────────────
async function capturar() {
  if (!instSel) return;
  const wh = document.getElementById('cfgWh').value.trim() || cfg.webhookUrl;
  if (!wh) {
    alert('Configure o Webhook n8n nas ⚙️ Configurações.');
    document.getElementById('cfgBtn').classList.add('open');
    document.getElementById('cfgBox').classList.add('vis');
    return;
  }

  const btn = document.getElementById('captBtn');
  btn.innerHTML = '<span class="spin"></span>Capturando...';
  btn.disabled = true;
  document.getElementById('stats').style.display = 'none';
  showLog();
  log(`🚀 Enviando para n8n — instância: <b>${instSel.instance}</b>`, 'inf');

  try {
    const resp = await fetch(wh, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(instSel)
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    const e = data.estatisticas || data;
    const total = e.total      ?? e.totalCapturados ?? '?';
    const novos = e.inseridos  ?? e.novosInseridos  ?? '?';
    const dup   = e.duplicados ?? e.jaExistiam      ?? '?';

    document.getElementById('sTotal').textContent = total;
    document.getElementById('sNovos').textContent = novos;
    document.getElementById('sDup').textContent   = dup;
    document.getElementById('stats').style.display = 'grid';

    if (novos > 0) {
      log(`✅ Concluído! <b>${novos}</b> novos leads salvos — ${dup} já existiam`, 'ok');
    } else {
      log(`ℹ️ Nenhum lead novo — todos já estão na planilha`, 'warn');
    }
  } catch(e) {
    log(`❌ Erro: ${e.message}`, 'err');
  }

  btn.innerHTML = '🚀 Capturar Leads';
  btn.disabled = false;
}

// ─── Log ──────────────────────────────────────────────────────
function showLog() { document.getElementById('logEl').classList.add('vis'); }
function log(msg, tipo = 'inf') {
  const el = document.getElementById('logEl');
  const t  = new Date().toLocaleTimeString('pt-BR');
  const d  = document.createElement('div');
  d.className = `l-line l-${tipo}`;
  d.innerHTML = `[${t}] ${msg}`;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}
</script>
</body>
</html>
